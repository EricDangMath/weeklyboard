server {
    listen 80;
    server_name zkb.yutianfu.me;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/zkb.yutianfu.me/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zkb.yutianfu.me;
    http2 on;

    root /www/wwwroot/zkb.yutianfu.me/dist;
    index index.html;
    client_max_body_size 5m;

    ssl_certificate /www/server/panel/vhost/cert/yutianfu.me/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/yutianfu.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    error_page 497 https://$host$request_uri;

    location = /api {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/zkb.yutianfu.me.log;
    error_log /www/wwwlogs/zkb.yutianfu.me.error.log;
}
